spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lending_dashboard?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  servlet.multipart:
    max-file-size: 20MB
    max-request-size: 20MB
  flyway.enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties.mail.smtp:
      auth: true
      starttls.enable: true
server.port: ${SERVER_PORT:8080}
app:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-change-this-development-secret}
  jwt-expiration: PT8H
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  npa-on-dpd-over-seven: false
  # Optional, for example http://localhost:8081/api/borrowers/{loanId}
  borrower-lookup-url: ${BORROWER_LOOKUP_URL:}
  upload-notification:
    enabled: ${UPLOAD_NOTIFICATION_ENABLED:false}
    from: ${UPLOAD_NOTIFICATION_FROM:${MAIL_USERNAME:}}
springdoc.swagger-ui.path: /swagger-ui.html
